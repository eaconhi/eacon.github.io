<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>我的车载屏</title><link rel="stylesheet" href="./style.css"></head>
<body>
<main class="screen" id="screen"><img id="wallpaper" alt="当前壁纸"><video id="motion" muted loop playsinline preload="metadata" hidden></video><div class="shade"></div>
<header class="topbar"><div><b>我的车载屏</b><small>壁纸 · 氛围 · 时间</small></div><nav><button id="libraryButton">图库</button><button id="sensorButton">海拔 / 指南针</button><button id="settingsButton">设置</button><button id="fullscreenButton">全屏</button></nav></header>
<section class="clock" aria-label="时钟"><time id="time">--:--</time><p id="date"></p></section>
<footer class="toolbar"><button id="previousButton" aria-label="上一张">‹</button><span id="mediaName">正在加载图库</span><button id="nextButton" aria-label="下一张">›</button><button id="favoriteButton">♡ 收藏</button><button id="deleteOwnButton" hidden>移除自选素材</button><button id="carouselButton">开始轮播</button><span id="message" role="status"></span></footer>
</main>
<section class="drawer" id="library" hidden role="dialog" aria-label="壁纸图库"><div class="drawer-heading"><div><h2>壁纸图库</h2><p id="librarySummary"></p></div><button id="closeLibrary" aria-label="关闭图库">×</button></div><div class="filters"><select id="mediaFilter" aria-label="素材类型"><option value="all">全部素材</option><option value="image">静态壁纸</option><option value="video">动态背景</option><option value="favorites">我的收藏</option><option value="own">我的素材</option></select><select id="categoryFilter" aria-label="壁纸分类"><option value="">全部分类</option></select><label class="upload">加入自己的素材<input id="ownFiles" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm" multiple></label></div><p class="hint">自选素材只保存在当前浏览器，清理浏览器数据后会丢失。静态版不支持从手机上传到另一台车机。</p><div class="grid" id="grid"></div></section>
<section class="settings" id="settings" hidden role="dialog" aria-label="显示设置"><div class="settings-card"><button id="closeSettings" class="close" aria-label="关闭显示设置">×</button><h2>显示设置</h2><label><input id="clockVisible" type="checkbox" checked> 显示时钟</label><label>背景亮度 <input id="brightness" type="range" min="35" max="100" value="85"></label><label>轮播间隔 <select id="interval"><option value="15000">15 秒</option><option value="60000" selected>1 分钟</option><option value="300000">5 分钟</option></select></label><button id="hideControls">进入展示模式</button><p>展示模式轻点屏幕恢复操作栏。请在停车时完成选图与设置。</p><p>海拔和方向需要浏览器开放传感器权限；不能读取时可在检测页查看原因。</p><a href="../sensors.html">打开传感器检测与手机转发页</a><small>学习自用版本，与原站无关。无推广、无账号采集。</small></div></section>
<script type="module" src="./app.js"></script></body></html>
