/* Shared by the pre-Vue bootstrap, standalone pages and Vue controllers. */
(function () {
  if (window.ScreenBrand) return;
  const normalColors = Object.freeze(['#2374e1', '#7c3aed', '#38bdf8', '#fbbf24', '#f472b6', '#ffffff']);
  const brands = Object.freeze(Object.fromEntries([
    ['xp', '小 P桌面', 'xpeng', '小鹏', 'xp.lzxin.eu.org'],
    ['ts', '特屏', 'tesla', '特斯拉', 'ts.lzxin.eu.org'],
    ['dev', 'D屏', 'dev', 'DEV', 'dev.leung.xin'],
  ].map(([key, shortName, sender, vehicle, host]) => [key, Object.freeze({
    key, shortName, name: key === 'xp' ? '小 P桌面' : shortName + ' live', vehicle, host,
    logo: key === 'xp' ? './branding/xiaop-logo-512.png?v=20261011-xiaop-loader' : './assets-v590/images/icons/icon-' + key + '.png',
    background: '/assets-v590/images/backgrounds/bg-' + key + '.png',
    sender: Object.freeze({ name: sender, id: sender }),
    confetti: key === 'ts' ? Object.freeze(['#12a594', '#22c7b5', '#67e8f9', '#fbbf24', '#fb7185', '#ffffff']) : normalColors,
  })])));
  const storageKey = 'chat-startup-brand';
  const normalize = value => typeof value === 'string' && Object.prototype.hasOwnProperty.call(brands, value) ? value : '';
  const hostBrand = (hostname = window.location.hostname) => normalize(String(hostname).toLowerCase().split('.')[0]);
  // A bare hostname such as "ts" is not a branded domain.
  const domainBrand = () => String(window.location.hostname).includes('.') ? hostBrand() : '';
  const cachedBrand = () => { try { return normalize(localStorage.getItem(storageKey)); } catch { return ''; } };
  let key = domainBrand() || cachedBrand();
  let source = domainBrand() ? 'domain' : key ? 'cache' : 'fallback';
  key = key || 'xp';
  const listeners = new Set();
  const page = document.documentElement.dataset.brandPage || 'main';
  function syncDocument() {
    const brand = brands[key];
    document.documentElement.dataset.brand = key;
    document.documentElement.dataset.brandResolved = source === 'fallback' ? '0' : '1';
    const suffix = { preview: ' · 效果预览', upload: ' · 上传动图', donation: ' · 打赏通知', offline: ' - 服务维护中' }[page] || '';
    document.title = ((page === 'main' || page === 'offline') && source === 'fallback' ? '小 P桌面' : brand.name) + suffix;
    if (page === 'offline') return;
    for (const rel of page === 'main' ? ['icon', 'apple-touch-icon'] : ['icon']) {
      let link = document.querySelector('link[rel="' + rel + '"]');
      if (!link) { link = document.createElement('link'); link.rel = rel; link.type = 'image/png'; document.head.appendChild(link); }
      link.href = page === 'preview' ? './mobilePreview/assets/icon-' + key + '.png' : brand.logo;
    }
  }
  function applyConfigured(value) {
    const configured = normalize(value), domain = domainBrand();
    if (!domain && !configured) return brands[key];
    const previous = brands[key];
    key = domain || configured;
    source = domain ? 'domain' : 'config';
    if (!domain) { try { localStorage.setItem(storageKey, key); } catch {} }
    syncDocument();
    if (previous !== brands[key]) for (const listener of listeners) listener(brands[key], previous);
    return brands[key];
  }
  window.ScreenBrand = Object.freeze({
    get current() { return brands[key]; }, get source() { return source; },
    storageKey, normalize, hostBrand: domainBrand, applyConfigured,
    profile: value => brands[normalize(value) || 'xp'],
    subscribe(listener) { listeners.add(listener); return () => listeners.delete(listener); },
  });
  syncDocument();
})();
</script>

  <script>
    (function enableStartupTouchFullscreenToggle() {
      var loader = document.getElementById('startupLoader');
      var previewEntry = loader && loader.querySelector('.startup-preview-entry');
      if (!loader) return;

      var eventName = window.PointerEvent ? 'pointerup' : 'click';
      var switching = false;
      var observer = new MutationObserver(function () {
        if (loader.classList.contains('is-hidden') || (previewEntry && !previewEntry.hidden)) disable();
      });

      function disable() {
        loader.removeEventListener(eventName, toggleFullscreen);
        observer.disconnect();
      }

      function fullscreenElement() {
        return document.fullscreenElement || document.webkitFullscreenElement || null;
      }

      function toggleFullscreen(event) {
        if (eventName === 'pointerup' && event.isPrimary === false) return;
        if (event.target && event.target.closest && event.target.closest('.startup-cache-reset')) return;
        if (switching || loader.classList.contains('is-hidden') || (previewEntry && !previewEntry.hidden)) return;

        switching = true;
        try {
          var action;
          if (fullscreenElement()) {
            if (document.exitFullscreen) action = document.exitFullscreen();
            else if (document.webkitExitFullscreen) action = document.webkitExitFullscreen();
            else switching = false;
          } else {
            if (document.documentElement.requestFullscreen) action = document.documentElement.requestFullscreen();
            else if (document.documentElement.webkitRequestFullscreen) action = document.documentElement.webkitRequestFullscreen();
            else switching = false;
          }
          if (switching) Promise.resolve(action).catch(function () {}).then(function () { switching = false; });
        } catch (error) {
          switching = false;
        }
      }

      loader.addEventListener(eventName, toggleFullscreen, { passive: true });
      observer.observe(loader, { attributes: true, attributeFilter: ['class'] });
      if (previewEntry) observer.observe(previewEntry, { attributes: true, attributeFilter: ['hidden'] });
    }());

    (function enableStartupCacheRecovery() {
      var loader = document.getElementById('startupLoader');
      var text = loader && loader.querySelector('.startup-loading-text');
      var button = loader && loader.querySelector('.startup-cache-reset');
      var previewEntry = loader && loader.querySelector('.startup-preview-entry');
      if (!loader || !text || !button) return;

      function fallbackClearAndReload() {
        var exactKeys = [
          'chat-last-room-id', 'chat-announcement-room-date', 'display-app-mode',
          'chat-auto-screensaver', 'chat-fixed-fullscreen', 'chat-background-fullscreen-exit',
          'chat-fullscreen-clock', 'chat-theme-mode', 'chat-theme-auto-reset-date',
          'chat-power-save', 'chat-power-save-enabled-at', 'chat-thumbnail-panel-expanded',
          'chat-show-carousel-channel', 'chat-show-game-channel', 'chat-carousel-session', 'chat-carousel-playback',
          'chat-shared-image-effect', 'chat-image-effect-performance-mode',
          'chat-image-effect-chromatic', 'chat-image-effect-highlight-glow', 'chat-image-effect-edge-flow', 'chat-image-effect-rain-glass', 'chat-rain-glass-sound-enabled'
        ];
        var prefixes = ['chat-selected-image:', 'chat-viewer-fit-mode:', 'chat-video-playback-rate:', 'chat-image-effect-settings:'];
        var clearPreferences = function () {
          var keys = exactKeys.slice();
          try {
            for (var i = 0; i < localStorage.length; i += 1) {
              var key = localStorage.key(i);
              if (key && prefixes.some(function (prefix) { return key.indexOf(prefix) === 0; })) keys.push(key);
            }
            keys.forEach(function (key) { localStorage.removeItem(key); });
          } catch (error) {}
        };
        var cacheWork = typeof caches === 'undefined'
          ? Promise.resolve()
          : Promise.allSettled(['phone2car-image-cache-v1', 'phone2car-video-cache-v1'].map(function (name) { return caches.delete(name); }));
        cacheWork.then(function (results) {
          if (results && results.some(function (result) { return result.status === 'rejected'; })) throw new Error('media-cache-clear-failed');
          clearPreferences();
          try { sessionStorage.removeItem('chat-preview-source'); } catch (error) {}
          window.addEventListener('pagehide', clearPreferences, { once: true });
          window.location.reload();
        }).catch(function () {
          button.disabled = false;
          button.textContent = '清除失败，点击重试';
        });
      }

      button.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        if (button.disabled) return;
        button.disabled = true;
        button.textContent = '正在清除缓存…';
        if (typeof window.__clearStartupCacheAndReload === 'function') {
          Promise.resolve(window.__clearStartupCacheAndReload()).then(function (completed) {
            if (completed !== false) return;
            button.disabled = false;
            button.textContent = '清除失败，点击重试';
          });
        } else fallbackClearAndReload();
      });

      var recoveryTimer = 0;
      var consentPending = false;
      var recoveryShown = false;
      var initialLabel = loader.getAttribute('aria-label');
      function armRecoveryTimer() {
        window.clearTimeout(recoveryTimer);
        if (consentPending || loader.classList.contains('is-hidden')) return;
        recoveryTimer = window.setTimeout(function () {
          recoveryTimer = 0;
          if (consentPending || loader.classList.contains('is-hidden') || (previewEntry && !previewEntry.hidden) || loader.querySelector('.startup-retry')) return;
          text.hidden = true;
          button.hidden = false;
          recoveryShown = true;
          loader.setAttribute('aria-label', '无法正常进入，可清除缓存后重试');
        }, 60000);
      }
      // 阅读须知和“暂不使用”不是加载故障；同意后重新给予完整启动时间。
      window.__setStartupConsentPending = function (pending) {
        pending = pending === true;
        if (pending === consentPending) return;
        consentPending = pending;
        window.clearTimeout(recoveryTimer);
        recoveryTimer = 0;
        if (pending && recoveryShown) {
          button.hidden = true;
          text.hidden = false;
          recoveryShown = false;
          if (initialLabel === null) loader.removeAttribute('aria-label');
          else loader.setAttribute('aria-label', initialLabel);
        }
        if (!pending) armRecoveryTimer();
      };
      armRecoveryTimer();
    }());
  </script>
